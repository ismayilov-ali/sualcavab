name: Test Pipeline (CI)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Kodu əldə et (Checkout)
        uses: actions/checkout@v4

      - name: Python ${{ matrix.python-version }} mühitini qur
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Asılılıqları quraşdır (Dependencies)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Linting yoxlanışı (flake8)
        run: |
          # Sintaksis xətaları və təyin olunmamış dəyişənlər
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Üslub və mürəkkəblik yoxlanışı (xəbərdarlıq rejimində)
          flake8 . --count --exit-zero --max-complexity=12 --max-line-length=127 --statistics

      - name: Testləri icra et və əhatəliliyi ölç (pytest & coverage)
        run: |
          pytest --cov=app --cov-report=xml --cov-report=term-missing

      - name: Coverage hesabatını saxla (Artifact)
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: ignore

